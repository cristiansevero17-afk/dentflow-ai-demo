<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudioFlow Dental - Prodotto Operativo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }

      body {
        background: #f8fafc;
      }

      .boot {
        min-height: 100%;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #0f766e;
      }
    </style>
  </head>
  <body>
    <div id="root" class="boot">Caricamento StudioFlow Dental...</div>
    <script>
      async function bootProdottoStudioDentistico() {
        const response = await fetch("./ProdottoStudioDentistico.jsx", { cache: "no-store" });
        let source = await response.text();

        source = source
          .replace(/import\s+\{\s*useEffect,\s*useMemo,\s*useState\s*\}\s+from\s+"react";/, "const { useEffect, useMemo, useState } = React;")
          .replace("export default function ProdottoStudioDentistico", "function ProdottoStudioDentistico");

        const root = document.getElementById("root");
        root.className = "";
        root.textContent = "";

        const compiled = Babel.transform(
          `${source}\nReactDOM.createRoot(document.getElementById("root")).render(React.createElement(ProdottoStudioDentistico));`,
          { presets: ["react"] }
        ).code;

        new Function("React", "ReactDOM", compiled)(React, ReactDOM);
      }

      bootProdottoStudioDentistico().catch((error) => {
        document.getElementById("root").innerHTML =
          '<div style="max-width:720px;padding:32px;font-family:system-ui;color:#334155"><h1>Errore nel caricamento del prodotto</h1><p>Apri questa pagina tramite server locale o deploy Vercel.</p><pre style="white-space:pre-wrap;background:#fee2e2;color:#991b1b;padding:16px;border-radius:8px">' +
          String(error) +
          "</pre></div>";
      });
    </script>
  </body>
</html>
